plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.1'
	id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.spring'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.oracle.database.jdbc:ojdbc11:21.3.0.0'
	implementation("com.oracle.database.jdbc:ojdbc11:21.3.0.0")
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation("software.amazon.awssdk:dynamodb:2.31.30")
	implementation('org.springframework.boot:spring-boot-starter-jdbc')
	implementation group: 'com.oracle.database.jdbc', name: 'ojdbc11', version: '21.13.0.0'
	implementation group: 'com.oracle.database.jdbc', name: 'ucp11', version: '21.13.0.0'
}

tasks.named('test') {
	useJUnitPlatform()
}
